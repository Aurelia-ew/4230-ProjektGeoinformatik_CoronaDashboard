<aside class="sidebar">
  <a class="github-link" href="{{ site.github_url }}" target="_blank">
    Hier gehts zum Projekt auf GitHub
  </a>
  <div class="site-branding">
    <img
      class="site-logo"
      src="{{ '/Bilder/virus.png' | relative_url }}"
      alt="Corona Dashboard Logo">

    <h1 class="site-title">
      {{ site.title }}
    </h1>
  </div>
  <nav class="site-nav">
    {% for item in site.navbar %}
      {% if item.children %}
        <div class="nav-group">
          <a class="nav-group-title" href="{{ item.url | relative_url }}">
            {{ item.title }}
          </a>
          <div class="nav-submenu">
            {% for child in item.children %}
              <a class="site-nav-link" href="{{ child.url | relative_url }}">
                {{ child.title }}
              </a>
            {% endfor %}
          </div>
        </div>
      {% else %}
        <a class="site-nav-link" href="{{ item.url | relative_url }}">
          {{ item.title }}
        </a>
      {% endif %}
    {% endfor %}
  </nav>
</aside>
